[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "org-directory"
version = "0.2.2"
description = "Org charts and emergency contact sheets from the Microsoft 365 directory, kept up to date."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "m365-graph>=0.1",   # sign-in and Graph requests; not on PyPI, see README
    "win-background>=0.1",   # the scheduled task, notifications, locks and the log; not on PyPI, see README
    "people-first-client>=0.1",   # People First's sign-in and API client (only used with [people_first]); not on PyPI
]

[project.optional-dependencies]
people-first = ["playwright>=1.44"]   # kept for old install commands: people-first-client brings Playwright

[project.scripts]
org-directory = "org_directory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
