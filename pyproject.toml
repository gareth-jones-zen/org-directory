[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "org-directory"
version = "0.1.0"
description = "Org charts written from the Microsoft 365 directory, kept up to date."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "m365-graph>=0.1",   # sign-in and Graph requests; not on PyPI, see README
]

[project.scripts]
org-directory = "org_directory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
